version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: music_lib_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-music_library}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_lib_backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-music_library}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - SERVER_PORT=8080
      - ENVIRONMENT=development
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
