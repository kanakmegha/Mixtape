name: Build and Publish Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIXTAPE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret MIXTAPE_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

      - name: Run unit tests and build signed release APK
        working-directory: android
        env:
          MIXTAPE_KEYSTORE_PATH: release.keystore
          MIXTAPE_KEYSTORE_PASSWORD: ${{ secrets.MIXTAPE_KEYSTORE_PASSWORD }}
          MIXTAPE_KEY_ALIAS: ${{ secrets.MIXTAPE_KEY_ALIAS }}
          MIXTAPE_KEY_PASSWORD: ${{ secrets.MIXTAPE_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -Pmixtape.versionCode="$VERSION_CODE" \
            -Pmixtape.versionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Mixtape.apk"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs Mixtape.apk

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mixtape ${{ github.ref_name }}
          body: |
            Automated Android release built from tag ${{ github.ref_name }}.

            1. Download Mixtape.apk on your Android phone.
            2. Open the file and approve installation/update.
            3. Keep the app installed to retain its local data.

            Note: Android requires user confirmation for installing sideloaded APK updates.
          files: Mixtape.apk
          draft: false
          prerelease: false
